name: Build personal extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The repository's real extension-host smoke test requires macOS.
    runs-on: macos-14
    timeout-minutes: 20
    env:
      VSCE_STORE: file
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check dependency policy before installing
        run: npm run deps:check

      - name: Install the locked dependencies without install scripts
        run: npm ci --ignore-scripts

      - run: npm audit
      - run: npm test
      - run: npx tsc --noEmit

      # The checked-in manifest owns the personal identity for local and CI builds.
      # Packaging runs the same identity regression checks via vscode:prepublish.
      - name: Package the personal VSIX
        run: npm run package:vsix -- --out "$RUNNER_TEMP/window-colors-personal.vsix"

      - name: Download VS Code for the extension-host smoke test
        run: |
          curl --fail --location --retry 3 \
            https://update.code.visualstudio.com/latest/darwin-universal/stable \
            --output "$RUNNER_TEMP/vscode.zip"
          ditto -x -k "$RUNNER_TEMP/vscode.zip" "$RUNNER_TEMP/vscode"
          app=$(find "$RUNNER_TEMP/vscode" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          echo "VSCODE_APP=$app" >> "$GITHUB_ENV"
          ls -l "$app/Contents/MacOS"

      - name: Verify activation, settings migration, and shutdown cleanup
        run: bash scripts/smoke_extension_host.sh "$RUNNER_TEMP/window-colors-personal.vsix"

      - name: Show smoke-test launch diagnostics on failure
        if: failure()
        run: |
          if [ -f /tmp/uwc-smoke/launch.log ]; then
            cat /tmp/uwc-smoke/launch.log
          fi

      - name: Record the package checksum and source commit
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 window-colors-personal.vsix > window-colors-personal.vsix.sha256
          printf 'Source: https://github.com/%s/commit/%s\nBuild: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD.txt

      - name: Save the tested personal build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: window-colors-personal-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/window-colors-personal.vsix
            ${{ runner.temp }}/window-colors-personal.vsix.sha256
            ${{ runner.temp }}/BUILD.txt
          if-no-files-found: error
          retention-days: 30
